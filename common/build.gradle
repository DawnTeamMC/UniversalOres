// Loader-agnostic code, compiled against vanilla Minecraft only.
// This project is never shipped: the loader projects compile its sources into their own jars.
// Anything loader-specific goes through fr.hugman.universal_ores.platform.
plugins {
    id "net.neoforged.moddev"
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/generated'
            exclude '.cache/**'
        }
    }
    // Client-only code, kept apart so it can't leak into the common (server-safe) code
    client {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    // Checks the generated ore textures against vanilla's and the former hand-made ones
    test {
        compileClasspath += main.output + client.output
        runtimeClasspath += main.output + client.output
    }
}

configurations {
    clientCompileOnly.extendsFrom compileOnly
    testCompileOnly.extendsFrom compileOnly
}

neoForge {
    neoFormVersion = neo_form_version
    // Same access changes as the Fabric access widener
    accessTransformers.from(project(':neoforge').file('src/main/resources/META-INF/accesstransformer.cfg'))
    addModdingDependenciesTo(sourceSets.client)
    addModdingDependenciesTo(sourceSets.test)
}

dependencies {
    // Both loaders ship Mixin and MixinExtras
    compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    compileOnly "org.jetbrains:annotations:26.0.2"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Draws the ore variants of every stone and ore type found in the given mods, without starting the game:
// ./gradlew :common:previewOreTextures -Pmods="path/to/mod.jar;path/to/other.jar" -Pout=build/preview.png
tasks.register('previewOreTextures', JavaExec) {
    group = 'universal ores'
    description = 'Draws the ore variants that Universal Ores would generate for the given mods'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'fr.hugman.universal_ores.client.texture.OreTexturePreview'
    args = [
            project.findProperty('out') ?: layout.buildDirectory.file('ore_preview.png').get().asFile.path,
            project.findProperty('mods') ?: ''
    ]
}

// Nothing is shipped from here
tasks.withType(Jar).configureEach {
    enabled = false
}
