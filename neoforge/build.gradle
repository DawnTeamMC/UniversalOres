plugins {
    id "net.neoforged.moddev"
}

evaluationDependsOn(':common')
def common = project(':common')

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        // Boots a server, runs the game tests and exits: a quick way to check that the mod loads
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "universal_ores" {
            sourceSet sourceSets.main
        }
    }
}

// Mods Universal Ores has compatibility with, to try them in development: ./gradlew :neoforge:runClient -PcompatMods
// Their versions are Modrinth version IDs, for this Minecraft version.
repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    if (project.hasProperty('compatMods')) {
        runtimeOnly "maven.modrinth:terralith:lqrGyTjO" // Terralith 2.6.4
        runtimeOnly "maven.modrinth:lithostitched:UPpXQQpg" // Lithostitched 1.8.0, needed by Terralith
    }

    // Lets the IDE resolve the shared code; the classes themselves are compiled from source below
    compileOnly common.sourceSets.main.output
    compileOnly common.sourceSets.client.output
}

// Compile the shared sources into this jar.
// NeoForge has no split source sets: client classes only load through a Dist.CLIENT entrypoint.
tasks.named('compileJava', JavaCompile) {
    source common.sourceSets.main.java
    source common.sourceSets.client.java
}
processResources {
    from common.sourceSets.main.resources
    from common.sourceSets.client.resources

    def props = [
            "version"                : project.version,
            "minecraft_version_range": minecraft_version_range,
            "neoforge_version_range" : neoforge_version_range,
    ]
    inputs.properties props
    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}
sourcesJar {
    from common.sourceSets.main.allSource
    from common.sourceSets.client.allSource
}
