name: Bug Report
description: File a bug report
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Before continuing, you must be sure to be running on the LATEST version of Universal Ores. Otherwise, you have to try to reproduce the bug on the latest version of Universal Ores.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what has happened!
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      description: Which mod loader are you using?
      options:
        - Fabric
        - NeoForge
    validations:
      required: true
  - type: input
    id: loader-version
    attributes:
      label: Loader version
      description: What version of Fabric API or NeoForge are you using?
      placeholder: ex. 0.157.0+26.2 (Fabric API), 26.2.0.90 (NeoForge)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell