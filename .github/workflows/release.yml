# Automatically builds and publishes the mod when a new release is created on GitHub.
# It uploads the mod to GitHub, CurseForge and Modrinth.

name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate data files
        run: ./gradlew clean :fabric:runDatagen

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          create_pull_request: false
          push_translations: false
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Build with Gradle
        run: |
          VERSION=${{ github.event.release.tag_name }}
          # Same as what mc-publish would infer from the tag
          echo "MOD_VERSION=${VERSION#v}" >> $GITHUB_ENV
          ./gradlew build -Pversion=${VERSION#v}

      - name: Read Gradle properties
        id: gradle_properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: './gradle.properties'
          properties: 'mod_id mod_name mod_logo mod_color minecraft_version'

      # Project IDs, loaders and dependencies (with the mods Universal Ores is compatible with) are read from fabric.mod.json
      - name: Publish Fabric jar to GitHub, CurseForge and Modrinth
        id: publish_fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: ${{ github.event.release.name }} (Fabric)
          version: ${{ env.MOD_VERSION }}+fabric
          changelog: ${{ github.event.release.body }}
          java: 25
          game-versions: |
            >=${{ steps.gradle_properties.outputs.minecraft_version }}

          modrinth-featured: false

      - name: Publish NeoForge jar to GitHub, CurseForge and Modrinth
        id: publish_neoforge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 489884
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: 68kWHuUF
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: ${{ github.event.release.name }} (NeoForge)
          version: ${{ env.MOD_VERSION }}+neoforge
          changelog: ${{ github.event.release.body }}
          loaders: neoforge
          # The mods Universal Ores is compatible with (see common/src/main/resources/universal_ores), shown as
          # optional dependencies. The Fabric ones are in fabric.mod.json.
          dependencies: |
            betterend(optional){modrinth:IcERKldh}{curseforge:413596}
            betternether(optional){modrinth:fxX3RlL5}{curseforge:311377}
            biomeswevegone(optional){modrinth:NTi7d3Xc}{curseforge:1070751}
            caverns_and_chasms(optional){modrinth:tfjmPSbI}{curseforge:438005}
            create(optional){modrinth:LNytGWDc}{curseforge:328085}
            deeperdarker(optional){modrinth:fnAffV0n}{curseforge:659011}
            end_reborn(optional){modrinth:eYJwCO7t}#(ignore:curseforge)
            enderscape(optional){modrinth:btCrWvHr}{curseforge:536638}
            energizedpower(optional){modrinth:6pku8gW1}{curseforge:782147}
            expore(optional){modrinth:1HwCh5vX}#(ignore:curseforge)
            galosphere(optional){modrinth:Kn7xyQ1v}{curseforge:631098}
            immersiveengineering(optional){modrinth:tIm2nV03}{curseforge:231951}
            immersiveores(optional){modrinth:F9Vuwq3S}#(ignore:curseforge)
            jewelry(optional){modrinth:sNJAIjUm}{curseforge:910706}
            malum(optional){modrinth:jgzwYsAN}{curseforge:484064}
            mekanism(optional){modrinth:Ce6I4WUE}{curseforge:268560}
            modern_industrialization(optional){modrinth:Gov5Dboq}{curseforge:405388}
            mythicupgrades(optional){modrinth:ERH7cFoy}{curseforge:663567}
            natures_spirit(optional){modrinth:WBvnqHfV}{curseforge:907816}
            nether_ores_reborn(optional){modrinth:EUV7foM2}#(ignore:curseforge)
            occultism(optional){modrinth:sbJh4AZw}{curseforge:361026}
            oreganized(optional){modrinth:2FJutzEL}{curseforge:769203}
            overworld_netherite_ore(optional){modrinth:EvuYS8gZ}{curseforge:625133}
            overworldquartzore(optional){modrinth:yBLrXpfD}{curseforge:1061276}
            powah(optional){modrinth:KZO4S4DO}{curseforge:352656}
            promenade(optional){modrinth:GuE5FpvB}{curseforge:399648}
            quark(optional){modrinth:qnQsVE2z}{curseforge:243121}
            regions_unexplored(optional){modrinth:Tkikq67H}{curseforge:659110}
            resource_nether_ores(optional){modrinth:GXPQteCw}{curseforge:1009367}
            spectrum(optional){modrinth:3rc31Hgo}{curseforge:556967}
            stonier_stone(optional){curseforge:533396}#(ignore:modrinth)
            terralith(optional){modrinth:8oi3bsk5}{curseforge:513688}
            thermal(optional){modrinth:Xvg6q5Wp}{curseforge:222880}
            twigs(optional){modrinth:RG50cUrX}{curseforge:496913}
            wilderwild(optional){modrinth:AtHRJSUW}{curseforge:648511}
          java: 25
          game-versions: |
            >=${{ steps.gradle_properties.outputs.minecraft_version }}

          modrinth-featured: false

      - name: Add job summary
        run: |
          echo "# Results" >> $GITHUB_STEP_SUMMARY
          echo "- Mod ID: ${{ steps.gradle_properties.outputs.mod_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Mod Name: ${{ steps.gradle_properties.outputs.mod_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Mod Version: ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release Name: ${{ github.event.release.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Minecraft Version: ${{ steps.gradle_properties.outputs.minecraft_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Fabric: [CurseForge](${{ steps.publish_fabric.outputs.curseforge-url }}) / [Modrinth](${{ steps.publish_fabric.outputs.modrinth-url }})" >> $GITHUB_STEP_SUMMARY
          echo "- NeoForge: [CurseForge](${{ steps.publish_neoforge.outputs.curseforge-url }}) / [Modrinth](${{ steps.publish_neoforge.outputs.modrinth-url }})" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Link](${{ steps.publish_fabric.outputs.github-url }})" >> $GITHUB_STEP_SUMMARY
          echo "# Changelog" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.event.release.body }}" >> $GITHUB_STEP_SUMMARY

      - name: Send Discord webhook
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: |
            [{
              "title": "${{ github.event.release.name }} for ${{ steps.gradle_properties.outputs.minecraft_version }} Released",
              "color": ${{ steps.gradle_properties.outputs.mod_color }},
              "thumbnail": {
                "url": "${{ steps.gradle_properties.outputs.mod_logo }}"
              },
              "url": "${{ steps.publish_fabric.outputs.curseforge-url }}",
              "fields": [
                  {
                    "name": "Download now:",
                    "value": "<:curseforge:805066577871110196> CurseForge: [Fabric](${{ steps.publish_fabric.outputs.curseforge-url }}) / [NeoForge](${{ steps.publish_neoforge.outputs.curseforge-url }})\n<:modrinth:805066578215043092> Modrinth: [Fabric](${{ steps.publish_fabric.outputs.modrinth-url }}) / [NeoForge](${{ steps.publish_neoforge.outputs.modrinth-url }})\n[<:github:805066578164580392> GitHub](${{ steps.publish_fabric.outputs.github-url }})",
                    "inline": true
                  }
              ],
              "footer": {
                "text": "A Fabric & NeoForge Mod"
              }
            }]
